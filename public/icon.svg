<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo em azul cobalto / nórdico -->
    <linearGradient id="malbaBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Brilho sutil superior -->
    <radialGradient id="malbaTopGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do ponto característico Malba -->
    <linearGradient id="malbaDotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Sombra suave para o glifo M -->
    <filter id="malbaDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo Squircle (Arredondado moderno estilo App Icon) -->
  <rect width="512" height="512" rx="118" fill="url(#malbaBgGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#malbaTopGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Grupo do Glifo Central: Letra "M" + Ponto Identitário "Malba." -->
  <g filter="url(#malbaDropShadow)">
    <!-- Letra M geométrica com tipografia equilibrada -->
    <path
      d="M112 376V136h58l86 130 86-130h58v240h-52V222l-72 108h-40l-72-108v154H112z"
      fill="#FFFFFF"
    />
    <!-- O Ponto Azul Celeste Característico do Malba -->
    <circle cx="430" cy="354" r="22" fill="url(#malbaDotGradient)" />
  </g>
</svg>
